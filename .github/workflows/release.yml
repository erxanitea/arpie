# Builds desktop bundles on a version tag and attaches them to a GitHub Release.
#
# VERIFY ON FIRST TAG: `flet build` requires the Flutter SDK + each platform's
# native toolchain, and the exact data-bundling flags vary between Flet
# versions. Run this once against your pinned Flet and adjust the build step if
# the produced bundle is missing assets or the Flet client. See docs/PACKAGING.md.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Flutter (required by `flet build`)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.8"

      - name: Linux build deps
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build desktop bundle
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: >-
          flet build ${{ matrix.target }}
          --project Arpie
          --yes
          --no-rich-output
          --skip-flutter-doctor
          --exclude 'docs/course-deliverables'

      - name: Package artifact
        shell: bash
        run: |
          cd build/${{ matrix.target }}
          if [ "${{ matrix.target }}" = "windows" ]; then
            7z a ../../arpie-${{ matrix.target }}.zip ./*
          else
            tar -czf ../../arpie-${{ matrix.target }}.tar.gz ./*
          fi

      - name: Build Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$version" packaging/windows/installer.iss

      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            arpie-${{ matrix.target }}.zip
            arpie-${{ matrix.target }}.tar.gz
            arpie-windows-setup.exe
          fail_on_unmatched_files: false
